<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script>
        const path = window.location.pathname;

        if (path.startsWith('/BursaKlimaKombi/')) {
            const redirect = '/BursaKlimaKombi/?redirect=' +
                encodeURIComponent(path + window.location.search + window.location.hash);

            window.location.replace(redirect);
        }
    </script>
</head>

<body>
</body>

</html>
